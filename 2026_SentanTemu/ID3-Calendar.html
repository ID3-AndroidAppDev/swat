<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentan Navi - Calendar</title>

  <style>
    :root {
      --primary-green: #0e955a;
      --secondary-green: #90c41f;
      --text-dark: #222;
      --bg: #f4f4f4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 20px;
      color: var(--text-dark);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 25px;
      background: white;
      border-bottom: 4px solid var(--secondary-green);
      margin: -20px -20px 20px -20px;
    }

    header h1 {
      flex: 1;
      text-align: center;
      color: var(--primary-green);
      font-size: 2.2rem;
      font-weight: bold;
      margin: 0;
    }

    .logo {
      width: auto;
      height: auto;
      max-height: 55px;
    }

    .menu-btn {
      width: 60px;
      height: 60px;
      border: none;
      border-radius: 12px;
      background: var(--primary-green);
      color: white;
      font-size: 2rem;
      cursor: pointer;
      transition: 0.2s ease;
      margin: 0;
      padding: 0;
    }

    .menu-btn:hover {
      background: var(--secondary-green);
    }

    .nav-sidebar {
      position: fixed;
      top: 0;
      right: -300px;
      width: 300px;
      height: 100vh;
      background: white;
      border-left: 4px solid var(--primary-green);
      padding: 20px;
      transition: right 0.3s ease;
      z-index: 1000;
      box-shadow: -2px 0 15px rgba(0, 0, 0, 0.2);
      overflow-y: auto;
    }

    .nav-sidebar.active {
      right: 0;
    }

    .nav-sidebar h3 {
      margin-top: 25px;
      margin-bottom: 10px;
      color: var(--primary-green);
      border-bottom: 2px solid var(--secondary-green);
      padding-bottom: 5px;
    }

    .nav-sidebar a {
      display: block;
      text-decoration: none;
      color: var(--text-dark);
      padding: 10px;
      margin-bottom: 5px;
      border-radius: 8px;
    }

    .nav-sidebar a:hover {
      background: var(--secondary-green);
      color: white;
    }

    .close-btn {
      border: none;
      background: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--primary-green);
      margin-bottom: 10px;
      padding: 5px;
    }

    .calendar-box {
      background-color: white;
      border: 1px solid #f4f4f4;
      border-radius: 6px;
      padding: 15px;
      max-width: 700px;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .calendar-header h1 {
      font-size: 20px;
      color: var(--primary-green);
      margin: 0;
    }

    .calendar-header button,
    #addEventForm button {
      background-color: var(--primary-green);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .calendar-header button:hover,
    #addEventForm button:hover {
      background-color: var(--secondary-green);
    }

    .day-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .day-grid div {
      text-align: center;
      padding: 12px 5px;
      background-color: #f4f4f4;
      border-radius: 4px;
      font-size: 14px;
      min-height: 45px;
    }

    .weekday {
      font-weight: bold;
      background-color: transparent !important;
      color: var(--primary-green);
      min-height: auto !important;
    }

    .today {
      background-color: var(--secondary-green) !important;
      font-weight: bold;
      color: white;
    }

    .event {
      display: block;
      font-size: 10px;
      color: var(--primary-green);
      margin-top: 3px;
    }

    .today .event {
      color: white;
    }

    .event-box {
      margin-top: 15px;
      max-width: 700px;
    }

    .event-title {
      font-size: 16px;
      color: #48604d;
      margin-top: 0;
    }

    #addEventForm {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    #addEventForm label {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
    }

    #eventDay {
      width: 80px;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .event-name {
      flex: 1;
      min-width: 150px;
    }

    #eventLabel {
      width: 100%;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    @media (max-width: 600px) {

      header {
        padding: 12px 16px;
      }

      header h1 {
        font-size: 1.6rem;
      }

      .logo {
        max-width: 120px;
      }

      .menu-btn {
        width: 50px;
        height: 50px;
        font-size: 1.6rem;
      }

      .calendar-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .calendar-header h1 {
        margin: 0;
      }

      .day-grid {
        gap: 3px;
      }

      .day-grid div {
        padding: 8px 2px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

<header>

  <a href="homepage.html">
    <img
      class="logo"
      src="https://www.kuas.ac.jp/wp-content/themes/kuasuni-theme/build/images/kuasuni-logo-sm.png"
      alt="KUAS Logo">
  </a>

  <h1>KUAS ナビ</h1>

  <button class="menu-btn" type="button">☰</button>

</header>

<div id="nav-sidebar" class="nav-sidebar">

  <button class="close-btn" type="button" onclick="toggleMenu()">✕</button>

  <h3>Academic</h3>
  <a href="ID3-Calendar.html">Schedule</a>
  <a href="#">Attendance</a>
  <a href="calculus-linear-algebra.html">Class Profile</a>

  <h3>Student Services</h3>
  <a href="registration.html">Registration</a>
  <a href="ID3-QnA.html">Q&amp;A</a>
  <a href="#">Notices</a>

  <h3>Communication</h3>
  <a href="#">Sentan Mail</a>
  <a href="#">Announcements</a>

  <h3>Settings</h3>
  <a href="#">Preferences</a>

</div>

<div class="calendar-box">

  <div class="calendar-header">

    <h1 id="monthTitle">July 2026</h1>

    <div>
      <button type="button" onclick="changeMonth(-1)">Previous</button>
      <button type="button" onclick="changeMonth(1)">Next</button>
    </div>

  </div>

  <div class="day-grid" id="dayGrid"></div>

</div>

<div class="calendar-box event-box">

  <h1 class="event-title">
    Add an event to this month
  </h1>

  <form id="addEventForm">

    <div>
      <label for="eventDay">Day of month</label>

      <input
        type="number"
        id="eventDay"
        min="1"
        max="31"
        required>
    </div>

    <div class="event-name">

      <label for="eventLabel">Event name</label>

      <input
        type="text"
        id="eventLabel"
        required>

    </div>

    <button type="submit">
      Add event
    </button>

  </form>

</div>

<script>

  var currentMonth = 6;
  var currentYear = 2026;

  var monthNames = [
    "January",
    "February",
    "March",
    "April",
    "May",
    "June",
    "July",
    "August",
    "September",
    "October",
    "November",
    "December"
  ];

  var events = {
    "6-24": ["Tuition due"],
    "6-29": ["Scholarship deadline"],
    "6-3": ["Intensive begins"]
  };

  function drawCalendar() {

    var grid = document.getElementById("dayGrid");

    grid.innerHTML = "";

    document.getElementById("monthTitle").innerText =
      monthNames[currentMonth] + " " + currentYear;

    var weekdays = [
      "Sun",
      "Mon",
      "Tue",
      "Wed",
      "Thu",
      "Fri",
      "Sat"
    ];

    for (var i = 0; i < 7; i++) {

      var label = document.createElement("div");

      label.innerText = weekdays[i];
      label.className = "weekday";

      grid.appendChild(label);
    }

    var daysInMonth =
      new Date(currentYear, currentMonth + 1, 0).getDate();

    var startDay =
      new Date(currentYear, currentMonth, 1).getDay();

    for (var i = 0; i < startDay; i++) {

      var blank = document.createElement("div");

      grid.appendChild(blank);
    }

    for (var day = 1; day <= daysInMonth; day++) {

      var dayBox = document.createElement("div");

      dayBox.innerText = day;

      if (
        currentMonth === 6 &&
        currentYear === 2026 &&
        day === 24
      ) {
        dayBox.className = "today";
      }

      var key = currentMonth + "-" + day;

      if (events[key]) {

        for (var e = 0; e < events[key].length; e++) {

          var eventText = document.createElement("span");

          eventText.className = "event";
          eventText.innerText = events[key][e];

          dayBox.appendChild(eventText);
        }
      }

      grid.appendChild(dayBox);
    }
  }

  function changeMonth(direction) {

    currentMonth = currentMonth + direction;

    if (currentMonth > 11) {

      currentMonth = 0;
      currentYear++;

    } else if (currentMonth < 0) {

      currentMonth = 11;
      currentYear--;
    }

    drawCalendar();
  }

  document
    .getElementById("addEventForm")
    .addEventListener("submit", function(event) {

      event.preventDefault();

      var day =
        document.getElementById("eventDay").value;

      var label =
        document.getElementById("eventLabel").value;

      var key = currentMonth + "-" + day;

      if (!events[key]) {
        events[key] = [];
      }

      events[key].push(label);

      drawCalendar();

      document
        .getElementById("addEventForm")
        .reset();
    });

  const menuBtn = document.querySelector(".menu-btn");
  const navSidebar = document.getElementById("nav-sidebar");

  window.toggleMenu = function() {
    navSidebar.classList.toggle("active");
  };

  menuBtn.addEventListener("click", toggleMenu);

  drawCalendar();

</script>

</body>

</html>
